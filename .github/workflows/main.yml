name: Build Mac

on:
  workflow_dispatch: {}
    
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    environment: master
    steps:
    - uses: actions/checkout@v4
      with:
        repository: cajigaslab/Thalamus
        path: Thalamus

    - name: Restore
      run: |
        cd Thalamus/dotnet
        msbuild -t:restore "/p:Platform=Any CPU"

    - name: Build
      run: |
        cd Thalamus/dotnet
        msbuild dotnet.sln /p:Configuration=Debug "/p:Platform=Any CPU"
        
    - name: Check
      run: |
        ls Thalamus/dotnet/dotnet/bin/Debug
