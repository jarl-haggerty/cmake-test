name: Build Mac

on:
  workflow_dispatch: {}
    
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    environment: master
    steps:
    - uses: actions/checkout@v4
    - name: Archive .pdb
      shell: cmd
      run: |
        #openssl pkcs12 -in cred.pfx -nocerts -out key.pem -nodes
        #openssl pkcs12 -in cred.pfx -clcerts -out cert.pem -nokeys
        choco install curl
        where curl
    - shell: cmd
      run: |
        echo ${{ secrets.PFX }} | base64 -d > cred.pfx
        where curl
        echo 11111111111111111111111111111
        del C:\Windows\System32\curl.exe
        where curl
        echo 11111111111111111111111111111
        "C:\ProgramData\Chocolatey\bin\curl.exe" --cert-type P12 --cert cred.pfx --data-binary @CMakeLists.txt -H "Content-Type: application/octet-stream" https://sleeve.ophanim.org/proc/experiments/cicd/days/000000/files/CMakeLists.txt
        
    - run: clang --version
    - run: git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$env:USERPROFILE/depot_tools"
    - run: echo "$env:USERPROFILE/depot_tools" >> $env:GITHUB_PATH
    - run: gclient
      shell: cmd
    - run: gclient sync --no-history --nohooks
      shell: cmd
    #- shell: cmd
    #  run: mklink /j D:\LLVM "C:\Program Files\LLVM"
    - shell: bash
      run: |
        mkdir -p crashpad/out/Default
        cat << EOF > crashpad/out/Default/args.gn
        clang_path="C:/Program Files/LLVM"
        EOF
    - run: cat crashpad/out/Default/args.gn
    - run: cd crashpad && gn gen out/Default
      shell: cmd
    - run: ninja -v -C crashpad/out/Default obj/client/client.lib obj/client/common.lib obj/util/util.lib obj/third_party/mini_chromium/mini_chromium/base/base.lib crashpad_handler.exe
      shell: cmd
